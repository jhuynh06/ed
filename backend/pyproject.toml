[project]
name = "ed-backend"
version = "0.1.0"
description = "Ed — emotionally intelligent companion bear backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.10.0",
    "chromadb>=0.5.0",
    "aiosqlite>=0.20.0",
    "numpy>=2.0.0",
    "silero-vad>=5.1",
    "groq>=0.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "transformers>=5.7.0",
    "tokenizers==0.22.2",
    "sounddevice>=0.5.1",
    "python-multipart>=0.0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]
