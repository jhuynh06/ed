; PlatformIO Project Configuration File
;
; Ed Audio Bridge — ESP32 microphone streaming over WebSocket
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; WebSocket library for streaming audio
lib_deps =
    links2004/WebSockets@^2.4.1

; Build flags for better performance
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
